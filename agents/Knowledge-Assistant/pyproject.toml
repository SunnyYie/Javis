[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Evidence-based terminal assistant for agent engineering knowledge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "tokenizers>=0.21,<1",
  "typer>=0.16,<1",
  "rich>=13.9,<15",
  "prompt-toolkit>=3.0,<4",
  "httpx>=0.28,<1",
  "redis>=5,<7",
  "pymilvus>=2.6,<2.7",
  "fastembed>=0.9.1,<1",
  "rank-bm25>=0.2.2,<0.3",
  "jieba>=0.42.1,<0.43",
  "trafilatura>=2,<3",
  "playwright>=1.50,<2",
  "tree-sitter-language-pack>=0.10,<1",
  # 0.26.0 corrupted source-point rows on the validated Python 3.12 runtime.
  "tree-sitter>=0.25.2,<0.26",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pexpect>=4.9,<5", "ruff>=0.9,<1"]
# Ragas 0.4.3 still imports VertexAI classes removed in community 0.4.
eval = ["ragas>=0.4.3,<0.5", "langchain-community>=0.3.31,<0.4"]

[project.scripts]
ka = "knowledge_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: real services and external providers (opt-in)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

