[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
description = "Evidence-based, read-only job search agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "typer>=0.16,<1",
  "rich>=13.9,<15",
  "prompt-toolkit>=3,<4",
  "redis>=5,<7",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<6",
  "rapidocr==3.10.0",
  "onnxruntime>=1.20,<2",
  "playwright>=1.50,<2",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1", "pexpect>=4.9,<5"]

[project.scripts]
ja = "job_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in tests using real services or private input"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
